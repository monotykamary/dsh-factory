name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Factory's optional Bun link workflow preserves one Cordis and DSH module
  # identity against a sibling Harness checkout. Keep this pin on a commit that
  # exposes the external orchestration and deliverables APIs Factory uses.
  DSH_HARNESS_REF: 6fbdc58a1ff33c01d3f24328eeb650c76645c87a

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout DeepSeek Harness
        run: |
          git init --quiet ../deepseek-harness
          git -C ../deepseek-harness remote add origin https://github.com/monotykamary/deepseek-harness.git
          git -C ../deepseek-harness fetch --depth 1 --quiet origin "$DSH_HARNESS_REF"
          git -C ../deepseek-harness checkout --quiet --detach FETCH_HEAD
          git -C ../deepseek-harness log -1 --oneline
      - name: Install Harness workspace
        working-directory: ../deepseek-harness
        run: bun install --frozen-lockfile
      - name: Build Harness library faces
        working-directory: ../deepseek-harness
        run: bun run build:lib:host && bun run build:lib:client
      - run: bun install --frozen-lockfile
      - run: bun run link:harness
      - run: bun run check
